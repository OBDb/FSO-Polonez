generations:
  - name: "First Generation"
    start_year: 1978
    end_year: 1991
    description: "The FSO Polonez was a Polish-built hatchback developed in collaboration with Fiat and produced by Fabryka Samochodów Osobowych. It was based on the Polski Fiat 125p platform with a completely new hatchback body designed by Zbigniew Wattson, Walter de Silva and Giorgetto Giugiaro. Initially available as a five-door hatchback from 1978, with three-door versions added in 1980. Available body styles included two- and four-door hatchbacks, station wagons, pickups, vans, and ambulances. Engine options included 1.3L, 1.5L, 1.6L, and 2.0L gasoline engines plus diesel options. The Caro variant succeeded this generation in 1991."

  - name: "Second Generation (Caro)"
    start_year: 1991
    end_year: 1997
    description: "Following the fall of communism and Poland's transition to a market economy, FSO introduced the facelifted Polonez Caro in 1991. It featured new headlamps and grille, updated front and rear bumpers, improved crash safety, and a redesigned dashboard. Body styles expanded to include sedan (Atu introduced 1996), pickup, and leisure activity vehicle variants. Engine options evolved to include Rover-sourced 1.4L K-series DOHC engines (1993), Ford 2.0L engines, and Citroën-sourced 1.9L diesel. The Caro was succeeded by the Caro Plus in 1997."

  - name: "Third Generation (Caro Plus)"
    start_year: 1997
    end_year: 2002
    description: "The Polonez Caro Plus was introduced in March 1997 with a new front grille, bumpers, and dashboard. A multi-point fuel injection system (Multec XM) was introduced in December 1997 for the 1.6L GSI variant. A station wagon (Kombi) version was added in 1999 with styling borrowed from the Daewoo Nubira. Production of passenger cars ended in Q1 2002, though pickup truck production continued until 2003. Despite continuous updates, the Polonez's outdated platform faced declining sales against imported used cars and new budget vehicles. The Caro Plus marked the end of Poland's most significant domestically developed passenger car."